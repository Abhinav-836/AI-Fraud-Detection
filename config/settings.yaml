# Application Settings
app:
  name: "AI Fraud Detection System"
  version: "2.0.0"
  environment: "development"
  debug: true

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: true
  cors_origins:            # override with CORS_ORIGINS="https://a.com,https://b.com"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

# Database Configuration
database:
  type: "postgresql"
  host: "localhost"
  port: 5432
  name: "fraud_detection"
  pool_size: 10
  max_overflow: 20

# Kafka Configuration
kafka:
  bootstrap_servers:       # override with KAFKA_BOOTSTRAP_SERVERS="host1:9092,host2:9092"
    - "localhost:9092"
  topics:
    transactions: "transactions"
    fraud_alerts: "fraud_alerts"
  consumer_group: "fraud_detection_group"
  auto_offset_reset: "earliest"

# Card history store (velocity / behaviour features)
history:
  backend: "memory"                  # memory | redis   (env HISTORY_BACKEND)
  redis_url: "redis://localhost:6379/0"  # env REDIS_URL; use redis when running several API workers

# Predictions + analyst feedback
storage:
  db_path: "data/fraud.db"           # SQLite, relative to FRAUD_DATA_DIR (env FRAUD_DB_PATH)

# Model Configuration
model:
  default_model: "xgboost"
  model_path: "models"     # override with MODEL_PATH
  retrain_interval_days: 7

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  file: "logs/app.log"
  max_bytes: 10485760
  backup_count: 5

# Monitoring: GET /api/v1/monitoring (latency, decision mix, score drift)