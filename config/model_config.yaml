# Model Configuration for Fraud Detection

xgboost:
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0
  reg_alpha: 0
  reg_lambda: 1
  scale_pos_weight: 1
  random_state: 42
  n_jobs: -1

random_forest:
  n_estimators: 100
  max_depth: 10
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: 'sqrt'
  random_state: 42
  n_jobs: -1

logistic_regression:
  penalty: 'l2'
  C: 1.0
  solver: 'lbfgs'
  max_iter: 1000
  random_state: 42
  n_jobs: -1

training:
  test_size: 0.2
  val_size: 0.1
  cv_folds: 5
  stratify: true
  random_state: 42

feature_engineering:
  time_windows: [1, 6, 24, 168]  # hours
  velocity_features: true
  behavioral_features: true
  interaction_features: true

preprocessing:
  scaler: 'standard'  # standard, minmax, robust
  handle_outliers: true
  outlier_method: 'iqr'  # iqr, zscore
  fill_missing: true
  encoding: 'target'  # target, onehot, label