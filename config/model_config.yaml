# Model Configuration for Fraud Detection

xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.08
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 2
  reg_lambda: 1
  scale_pos_weight: auto   # auto = negatives / positives in the training set
  tree_method: hist
  random_state: 42
  n_jobs: -1

random_forest:
  n_estimators: 150
  max_depth: 12
  min_samples_leaf: 2
  max_features: 'sqrt'
  random_state: 42
  n_jobs: -1

logistic_regression:
  # `penalty` and `n_jobs` were removed from LogisticRegression in scikit-learn 1.10
  C: 1.0
  solver: 'lbfgs'
  max_iter: 2000
  random_state: 42

training:
  # Chronological split: train on the oldest data, test on the newest
  val_size: 0.15
  test_size: 0.15

decision:
  # Review threshold: catch at least this share of fraud (validation data).
  # Some fraud imitates the customer perfectly, so 100% is not realistic;
  # higher targets mean more good customers sent to review.
  target_recall: 0.80
  # Decline threshold: at least this share of declines must be real fraud
  decline_precision: 0.90

preprocessing:
  scaler: 'standard'  # standard, minmax, robust
