---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: fraud-detection

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-config
  namespace: fraud-detection
data:
  LOG_LEVEL: "INFO"
  # Card history shared by all pods (deploy Redis separately, e.g. the Bitnami chart)
  HISTORY_BACKEND: "redis"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  CORS_ORIGINS: "https://fraud-detection.example.com"

---
# API Deployment
# The image bakes in a trained model (see Dockerfile.api). The old manifest
# mounted an empty PersistentVolumeClaim over /app/models, which would hide
# that model and silently drop the API back to rule-based scoring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-api
  namespace: fraud-detection
  labels:
    app: fraud-detection-api
spec:
  # Predictions and analyst feedback are stored in SQLite inside the pod
  # (FRAUD_DATA_DIR=/data). Keep one replica unless you move that store to a
  # shared database; card history is already shared through Redis.
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection-api
  template:
    metadata:
      labels:
        app: fraud-detection-api
    spec:
      containers:
      - name: fraud-detection-api
        # Replace with your pushed image. A bare "fraud-detection-api:latest"
        # with imagePullPolicy: Always resolves to docker.io/library/... and
        # fails with ErrImagePull.
        image: docker.io/YOUR_DOCKERHUB_USER/fraud-detection-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: fraud-detection-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-api-service
  namespace: fraud-detection
spec:
  type: ClusterIP
  selector:
    app: fraud-detection-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-detection-api-hpa
  namespace: fraud-detection
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-detection-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
# Stream Processor Deployment (requires a Kafka service reachable at
# KAFKA_BOOTSTRAP_SERVERS — not included in this manifest)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-stream-processor
  namespace: fraud-detection
  labels:
    app: fraud-detection-stream-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-detection-stream-processor
  template:
    metadata:
      labels:
        app: fraud-detection-stream-processor
    spec:
      containers:
      - name: stream-processor
        image: docker.io/YOUR_DOCKERHUB_USER/fraud-detection-api:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "src.streaming.stream_processor"]
        envFrom:
        - configMapRef:
            name: fraud-detection-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

---
# Ingress (the Service is ClusterIP; this is the only public entry point —
# the old LoadBalancer Service + Ingress exposed the API twice)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-detection-ingress
  namespace: fraud-detection
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # WebSocket connections need long-lived upstreams
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - fraud-detection.example.com
    secretName: fraud-detection-tls
  rules:
  - host: fraud-detection.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fraud-detection-api-service
            port:
              number: 80
