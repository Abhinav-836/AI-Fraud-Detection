<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <meta name="theme-color" content="#2c3e50" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="AI-powered Fraud Detection Dashboard - Real-time monitoring, analytics, and fraud prevention" />
    <meta name="keywords" content="fraud detection, AI analytics, transaction monitoring, security dashboard, fraud prevention" />
    <meta name="author" content="Fraud Detection System" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="AI Fraud Detection Dashboard" />
    <meta property="og:description" content="Real-time fraud monitoring and analytics platform" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fraud-detection.example.com" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fraud Detection Dashboard" />
    <meta name="twitter:description" content="AI-powered fraud detection and analytics" />
    
    <!-- PWA -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- REMOVED RESTRICTIVE CSP - Allow connections to backend -->
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Fraud Detection Dashboard | AI-Powered Security Analytics</title>
    
    <style>
        html { visibility: hidden; opacity: 0; }
        html.loaded { visibility: visible; opacity: 1; transition: opacity 0.3s ease; }
        
        #app-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        .loading-text {
            color: white;
            margin-top: 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f5f7fa;
            overflow-x: hidden;
        }
        
        * {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="app-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Fraud Detection Dashboard...</div>
    </div>
    
    <noscript>
        <div style="position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);color: white;display: flex;flex-direction: column;justify-content: center;align-items: center;text-align: center;padding: 20px;font-family: 'Inter', sans-serif;">
            <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">JavaScript Required</h1>
            <p style="font-size: 1.2rem; max-width: 600px; line-height: 1.6;">
                The Fraud Detection Dashboard requires JavaScript to function properly.
                Please enable JavaScript in your browser settings and refresh the page.
            </p>
        </div>
    </noscript>
    
    <div id="root"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const root = document.getElementById('root');
            const loading = document.getElementById('app-loading');
            
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.addedNodes.length > 0) {
                        setTimeout(function() {
                            loading.style.opacity = '0';
                            setTimeout(function() {
                                loading.style.display = 'none';
                                document.documentElement.classList.add('loaded');
                            }, 500);
                        }, 500);
                        observer.disconnect();
                    }
                });
            });
            
            observer.observe(root, { childList: true });
            
            setTimeout(function() {
                loading.style.display = 'none';
                document.documentElement.classList.add('loaded');
            }, 10000);
        });
        
        window.addEventListener('error', function() {
            document.getElementById('app-loading').style.display = 'none';
            document.documentElement.classList.add('loaded');
        });
    </script>
</body>
</html>
